<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Play Ramayana: The Legend of Prince Ram, an 8-bit platformer from Ayodhya to the golden deer. A Keyframe Kartel game.">
<meta property="og:title" content="Ramayana: The Legend of Prince Ram">
<meta property="og:description" content="An 8-bit platformer. Nine levels from Ayodhya to the golden deer. Play free in your browser.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#07051A">
<title>Ramayana: The Legend of Prince Ram</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: arcade cabinet column. Title bar, pixel screen, touch pad. Landscape phones put the pad beside the screen. */
:root{
  --bg:#07051A; --panel:#0E0A2A; --line:#2A2060; --gold:#F2C14E; --cream:#F7E7B4; --muted:#9A95B8; --red:#C8302E;
  --pixel:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  --body:"VT323", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--body);font-size:20px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{width:100%;max-width:768px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.b1{font-family:var(--pixel);font-size:14px;color:var(--gold);letter-spacing:.06em}
.b2{font-size:19px;color:var(--muted)}
.tools{display:flex;gap:8px}
.chip{font-family:var(--pixel);font-size:9px;letter-spacing:.05em;color:var(--cream);background:var(--panel);border:3px solid var(--line);padding:10px 12px;min-height:44px;cursor:pointer}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{width:100%;max-width:768px;max-width:min(768px,calc((100dvh - 210px) * 1.1428));min-width:256px}
canvas{display:block;width:100%;height:auto;aspect-ratio:256/224;image-rendering:pixelated;background:#000;border:4px solid var(--line);box-sizing:border-box;touch-action:none}
.pad{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad,.act{display:flex;gap:12px;align-items:center}
.btn{width:68px;height:68px;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--cream);border:3px solid var(--line);font-family:var(--pixel);font-size:9px;letter-spacing:.04em;touch-action:none;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
.btn svg{width:24px;height:24px}
.btn.on{background:var(--line);border-color:var(--gold)}
.btn.bow{border-color:var(--red);width:78px;height:78px}
.keys{margin:0;font-size:19px;color:var(--muted);text-align:center;max-width:65ch}
.keys b{color:var(--cream);font-weight:normal}
.foot{font-size:18px;color:var(--muted);text-align:center}
@media (pointer:fine){.pad{display:none}}
@media (pointer:coarse){.keys{display:none}}
@media (pointer:coarse) and (orientation:landscape) and (max-height:560px){
  .app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"bar bar bar" "dpad screen act";align-items:center;justify-items:center;gap:6px 16px;padding-block:6px}
  .bar{grid-area:bar}.b2{display:none}
  .pad{display:contents}
  .dpad{grid-area:dpad}
  .act{grid-area:act;flex-direction:column-reverse}
  .screen{grid-area:screen;max-width:calc((100dvh - 80px) * 1.1428)}
  .foot{display:none}
}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="b1">RAMAYANA</span><span class="b2">The Legend of Prince Ram · 8-bit</span></div>
    <div class="tools">
      <button id="snd" class="chip" type="button" aria-pressed="true">SOUND ON</button>
      <button id="pz" class="chip" type="button">PAUSE</button>
    </div>
  </header>
  <div class="screen"><canvas id="game" width="256" height="224" role="img" aria-label="Game screen"></canvas></div>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="btn" type="button" data-k="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4 L6 12 L16 20 Z" fill="currentColor"/></svg></button>
      <button class="btn" type="button" data-k="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 L18 12 L8 20 Z" fill="currentColor"/></svg></button>
    </div>
    <div class="act">
      <button class="btn" type="button" data-k="jump" aria-label="Jump">JUMP</button>
      <button class="btn bow" type="button" data-k="shoot" aria-label="Shoot bow, hold to charge">BOW</button>
    </div>
  </div>
  <p class="keys"><b>← →</b> move · <b>Z</b> or <b>Space</b> jump · <b>X</b> shoot, hold for astra · <b>Enter</b> pause</p>
  <footer class="foot">A Keyframe Kartel game · Ramayana, now in cinemas</footer>
</div>

<script>
(function(){
'use strict';
const W=256,H=224,ROWS=14,GY=192;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const PIX='"Press Start 2P", ui-monospace, Menlo, monospace';
const VT='"VT323", ui-monospace, Menlo, monospace';
const C={ink:'#0B0824',cream:'#F7E7B4',gold:'#F2C14E',saffron:'#E8833A',red:'#C8302E',pink:'#E86A9A',muted:'#8A85A8',line:'#2A2060',green:'#7FC98A',dim:'#C9B98A',salmon:'#FF8A7A',paper:'#F2E6C8',dark:'#1A0E08'};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const G={t:0,scene:'title',save:null,fade:0,sel:0,rects:[],L:null,toasts:[],paused:false,taps:[],pz:false};

/* ---------- difficulty + save ---------- */
const DIFF={
  normal:{name:'NORMAL',hp:5,spd:1,fire:1,cp:true,desc:['5 hearts. Checkpoints on.','For the story.']},
  kshatriya:{name:'KSHATRIYA',hp:3,spd:1.25,fire:1.3,cp:true,desc:['3 hearts. Faster enemies.','For warriors.']},
  valmiki:{name:'VALMIKI',hp:1,spd:1.4,fire:1.5,cp:false,desc:['1 heart. No checkpoints.','Canon. No mercy.']}
};
const DKEYS=['normal','kshatriya','valmiki'];
const D=()=>DIFF[G.save.diff]||DIFF.normal;
const SAVE_KEY='ramayana-lopr-v1';
const defSave=()=>({unlocked:1,best:{},diff:'normal',chosen:false,sound:true,astra:false});
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s.unlocked==='number')return Object.assign(defSave(),s);}catch(e){}return defSave();}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G.save));}catch(e){}}

/* ---------- input ---------- */
const keys={left:false,right:false,up:false,down:false,jump:false,shoot:false,pause:false,start:false};
const prev=Object.assign({},keys);
const hitK={},relK={};
const pressed=k=>!!hitK[k]||(keys[k]&&!prev[k]);
const released=k=>!!relK[k]||(!keys[k]&&prev[k]);
function kDown(k){if(!keys[k])hitK[k]=true;keys[k]=true;}
function kUp(k){if(keys[k])relK[k]=true;keys[k]=false;}
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'jump',KeyK:'jump',KeyX:'shoot',KeyJ:'shoot',Enter:'start',Escape:'pause',KeyP:'pause'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();ensureAudio();if(!e.repeat)kDown(k);});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(!k)return;e.preventDefault();kUp(k);});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();ensureAudio();kDown(k);b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{kUp(k);b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
cv.addEventListener('pointerdown',e=>{ensureAudio();const r=cv.getBoundingClientRect();G.taps.push({x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H});});
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{ensureAudio();G.save.sound=!G.save.sound;writeSave();applySound();});
document.getElementById('pz').addEventListener('click',()=>{G.pz=true;});
addEventListener('visibilitychange',()=>{if(document.hidden&&G.scene==='level'&&!G.paused){G.paused=true;G.sel=0;}});
const confirmP=()=>pressed('shoot')||pressed('start');
const backP=()=>pressed('pause');
function tapIn(r){for(const t of G.taps){if(t.x>=r.x&&t.x<=r.x+r.w&&t.y>=r.y&&t.y<=r.y+r.h)return true;}return false;}

/* ---------- audio ---------- */
const AU={ctx:null,master:null,track:null,step:0,next:0};
function ensureAudio(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AU.ctx=new A();AU.master=AU.ctx.createGain();AU.master.connect(AU.ctx.destination);applySound();setInterval(schedule,50);}catch(e){AU.ctx=null;}
}
function applySound(){sndBtn.textContent=G.save.sound?'SOUND ON':'SOUND OFF';sndBtn.setAttribute('aria-pressed',G.save.sound?'true':'false');if(AU.master)AU.master.gain.value=G.save.sound?0.55:0;}
function tone(f,d,type,v,slide,when){if(!AU.ctx||!G.save.sound)return;const t=AU.ctx.currentTime+(when||0);const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+0.02);}
let NB=null;
function noise(d,v){if(!AU.ctx||!G.save.sound)return;if(!NB){NB=AU.ctx.createBuffer(1,AU.ctx.sampleRate*0.6,AU.ctx.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}const s=AU.ctx.createBufferSource();s.buffer=NB;const g=AU.ctx.createGain();const t=AU.ctx.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(g);g.connect(AU.master);s.start(t);s.stop(t+d);}
const SFX={
  jump:()=>tone(300,0.12,'square',0.05,400),
  shoot:()=>tone(900,0.08,'triangle',0.08,-500),
  lak:()=>tone(700,0.06,'triangle',0.04,-300),
  astra:()=>{tone(500,0.25,'sawtooth',0.06,900);tone(1000,0.3,'triangle',0.05,600,0.05);},
  hit:()=>{tone(160,0.2,'square',0.08,-80);noise(0.15,0.07);},
  die:()=>noise(0.22,0.1),
  pick:()=>{tone(1200,0.06,'square',0.04);tone(1600,0.08,'square',0.04,0,0.06);},
  heart:()=>{tone(700,0.08,'triangle',0.08);tone(1050,0.12,'triangle',0.08,0,0.08);},
  menu:()=>tone(600,0.05,'square',0.04),
  ok:()=>{tone(800,0.07,'square',0.05);tone(1200,0.1,'square',0.05,0,0.07);},
  boss:()=>tone(140,0.1,'square',0.06,-40),
  charge:()=>tone(1400,0.15,'triangle',0.06,300),
  boom:()=>{noise(0.6,0.16);tone(80,0.5,'square',0.07,-40);},
  clear:()=>{[0,4,7,12].forEach((n,i)=>tone(523*Math.pow(2,n/12),0.18,'square',0.05,0,i*0.12));},
  fail:()=>{[7,4,0,-5].forEach((n,i)=>tone(392*Math.pow(2,n/12),0.25,'triangle',0.08,0,i*0.2));},
  mash:()=>tone(220+Math.random()*80,0.04,'square',0.04)
};
const SC=[0,2,4,7,9];
const nf=n=>261.63*Math.pow(2,(SC[((n%5)+5)%5]+12*Math.floor(n/5))/12);
const TRACKS={
  title:{bpm:92,lead:[5,null,6,7,8,null,7,6,5,null,4,null,5,6,7,null,8,null,9,8,7,null,6,5,6,null,5,4,5,null,null,null],bass:[0,0,-3,-3,-2,-2,0,0]},
  level:{bpm:128,lead:[5,7,8,7,5,7,9,8,7,5,6,7,8,null,7,null,5,7,8,10,9,8,7,6,5,6,7,5,4,null,5,null],bass:[0,-2,-3,-2,0,-2,-1,0]},
  boss:{bpm:150,lead:[5,5,8,5,7,5,6,4,5,5,8,5,9,8,7,null,3,3,5,3,4,3,2,1,3,3,5,3,6,5,4,null],bass:[-5,-5,-4,-4,-5,-5,-3,-3]},
  sad:{bpm:70,lead:[7,null,6,null,5,null,4,null,5,null,null,null,3,null,4,null,5,null,7,null,6,null,5,4,3,null,null,null,null,null,null,null],bass:[-5,-5,-7,-7,-6,-6,-5,-5]}
};
function music(name){if(AU.track===name)return;AU.track=name;AU.step=0;if(AU.ctx)AU.next=AU.ctx.currentTime+0.05;}
function schedule(){
  if(!AU.ctx||!AU.track||!G.save.sound)return;
  const tr=TRACKS[AU.track];const dur=60/tr.bpm/2;const now=AU.ctx.currentTime;
  if(AU.next<now-0.3)AU.next=now+0.02;
  while(AU.next<now+0.2){const i=AU.step%tr.lead.length;const n=tr.lead[i];const w=Math.max(0,AU.next-now);
    if(n!==null)tone(nf(n),dur*0.9,'square',0.025,0,w);
    if(i%4===0){const b=tr.bass[(i/4|0)%tr.bass.length];tone(nf(b)/2,dur*3.6,'triangle',0.05,0,w);}
    AU.step++;AU.next+=dur;}
}

/* ---------- sprites ---------- */
const SP={};
function spr(key,w,h,fn){let s=SP[key];if(s)return s;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');for(const r of fn()){g.fillStyle=r[4];g.fillRect(r[0],r[1],r[2],r[3]);}const f=document.createElement('canvas');f.width=w;f.height=h;const fg=f.getContext('2d');fg.translate(w,0);fg.scale(-1,1);fg.drawImage(c,0,0);s={r:c,l:f,w,h};SP[key]=s;return s;}
function flashOf(s){if(!s.fr){for(const k of ['r','l']){const c=document.createElement('canvas');c.width=s.w;c.height=s.h;const g=c.getContext('2d');g.drawImage(s[k],0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#FFFFFF';g.fillRect(0,0,s.w,s.h);s['f'+k]=c;}}return {r:s.fr,l:s.fl,w:s.w,h:s.h};}
function blit(s,x,y,face,alpha,sc){sc=sc||1;if(alpha!=null&&alpha<1)ctx.globalAlpha=Math.max(0,alpha);ctx.drawImage((face||1)>=0?s.r:s.l,Math.round(x),Math.round(y),s.w*sc,s.h*sc);ctx.globalAlpha=1;}

const HERO={
  ram:{skin:'#4A86DB',skin2:'#3A70C0',dhoti:'#F0A030',waist:'#C8302E',crown:true,jewel:'#C8302E',tilak:'#F2C14E'},
  ramBark:{skin:'#4A86DB',skin2:'#3A70C0',dhoti:'#8A6A3A',waist:'#5A4020',crown:false},
  lak:{skin:'#E9B98C',skin2:'#D9A87A',dhoti:'#4E9A5B',waist:'#F2C14E',crown:true,jewel:'#4E9A5B',tilak:'#E8833A'},
  lakBark:{skin:'#E9B98C',skin2:'#D9A87A',dhoti:'#8A6A3A',waist:'#5A4020',crown:false}
};
const LEGS={idle:[[4,19,3,4],[9,19,3,4],[3,23,4,1,1],[9,23,4,1,1]],w1:[[3,19,3,4],[10,19,3,3],[2,23,4,1,1],[10,22,3,1,1]],w2:[[5,19,3,3],[8,19,3,4],[5,22,3,1,1],[8,23,4,1,1]],jump:[[4,18,3,3],[9,19,3,2],[3,21,4,1,1],[9,21,4,1,1]]};
function heroRects(o,fr){
  const s=o.skin,r=[];
  if(o.crown)r.push([5,0,6,1,'#F2C14E'],[4,1,8,2,'#F2C14E'],[7,0,2,2,o.jewel]);else r.push([5,0,6,3,'#1A1033']);
  r.push([3,3,10,1,'#1A1033'],[3,4,1,6,'#1A1033'],[12,4,1,6,'#1A1033'],[4,4,8,4,s]);
  if(o.tilak)r.push([8,4,2,1,o.tilak]);
  r.push([8,5,1,1,'#0B0820'],[11,5,1,1,'#0B0820'],[6,8,4,1,o.skin2],[3,9,10,5,s]);
  if(o.crown)r.push([3,9,10,1,'#F2C14E'],[6,10,4,1,'#F2C14E']);else r.push([5,10,6,1,'#6B3E1E']);
  if(fr==='shoot')r.push([1,10,2,5,s],[12,9,4,2,s]);else if(fr==='lift')r.push([1,3,2,7,s],[13,3,2,7,s]);else r.push([1,10,2,5,s],[13,10,2,5,s]);
  r.push([3,14,10,5,o.dhoti],[3,14,10,1,o.waist]);
  const L=LEGS[(fr==='shoot'||fr==='lift')?'idle':fr]||LEGS.idle;
  for(const l of L)r.push([l[0],l[1],l[2],l[3],l[4]?'#7A4A22':s]);
  if(fr!=='lift')r.push([15,5,1,15,'#8B5A2B'],[14,4,1,1,'#8B5A2B'],[14,20,1,1,'#8B5A2B']);
  if(fr==='shoot')r.push([13,5,1,15,'#F7E7B4']);
  return r;
}
function kneelRects(o){return heroRects(o,'idle').filter(q=>q[1]<19&&q[0]<14).map(q=>[q[0],q[1]+4,q[2],q[3],q[4]]).concat([[2,22,12,2,o.dhoti],[0,23,16,1,'#8B5A2B']]);}
const hero=(k,fr)=>spr('h'+k+fr,16,24,()=>fr==='kneel'?kneelRects(HERO[k]):heroRects(HERO[k],fr));
function sitaRects(fr,col,border,tiara,skin){
  col=col||'#C0392B';border=border||'#F2C14E';skin=skin||'#E9B98C';const r=[];
  if(tiara!==false)r.push([5,1,6,1,'#F2C14E']);
  r.push([4,2,8,2,'#1A1033'],[3,3,1,12,'#1A1033'],[12,3,1,12,'#1A1033'],[4,4,8,4,skin],[7,4,2,1,'#C8302E'],[7,5,1,1,'#0B0820'],[10,5,1,1,'#0B0820'],[6,8,4,1,'#D9A87A'],[4,9,8,5,col],[4,9,8,1,border],[2,10,2,5,skin],[12,10,2,5,skin],[2,12,2,1,'#F2C14E'],[12,12,2,1,'#F2C14E'],[3,14,10,9,col],[3,21,10,2,border]);
  if(fr==='w1')r.push([3,23,3,1,skin],[10,23,3,1,skin]);else r.push([4,23,3,1,skin],[9,23,3,1,skin]);
  return r;
}
const sita=(fr,bark)=>spr('s'+fr+(bark?'b':''),16,24,()=>bark?sitaRects(fr,'#9C3A2A','#C99A3A',false):sitaRects(fr));
const statueS=on=>spr('st'+(on?1:0),16,24,()=>on?sitaRects('idle','#E9E4D8','#F2C14E',false):sitaRects('idle','#8A8A92','#6A6A72',false,'#9A9AA2').map(q=>[q[0],q[1],q[2],q[3],q[4]==='#0B0820'||q[4]==='#1A1033'?'#5A5A62':q[4]==='#C8302E'?'#7A7A82':q[4]]));
function sageRects(o){
  const r=[[4,0,8,3,o.hair],[3,3,10,2,o.hair],[4,4,8,4,o.skin],[7,4,2,1,'#F7E7B4'],[7,5,1,1,'#0B0820'],[10,5,1,1,'#0B0820'],[4,7,8,5,o.beard],[3,11,10,12,o.robe],[3,12,10,1,o.sash],[1,12,2,6,o.skin],[13,12,2,6,o.skin],[4,23,3,1,o.skin],[9,23,3,1,o.skin]];
  if(o.staff)r.push([15,2,1,22,'#8B5A2B'],[0,17,3,3,'#6B6B78']);
  if(o.axe)r.push([14,6,1,16,'#8B5A2B'],[12,4,4,5,'#D8D8E0'],[11,5,1,3,'#FFFFFF'],[0,4,1,16,'#8B5A2B'],[3,15,10,3,'#8A6A3A']);

/* ---------- level runtime ---------- */
function startLevel(i){

  let si=0;
  for(let x=0;x<d.w;x++)for(let y=0;y<ROWS;y++){
    const c=m[y][x];if('#B=wx.'.indexOf(c)>=0)continue;m[y][x]='.';
    const px=x*16,fy=(y+1)*16;
    switch(c){
      case 'P':L.start={x:px+3,y:fy-22};break;

      case 'a':L.ents.push(mk('thrower',px,fy-20,{w:14,h:20,hp:3,t:60}));break;
      case 'f':L.ents.push(mk('flyer',px,fy-10,{w:14,h:10,hp:1,x0:px,y0:fy-10}));break;
      case 'c':L.ents.push(mk('makara',px,fy-6,{w:18,h:10,hp:2,baseY:fy-6,st:'hide',t:rand(40,140)}));break;
      case 't':L.ents.push({type:'tulsi',x:px+4,y:fy-12,w:8,h:8});L.tulsiTotal++;break;
      case 'h':L.ents.push({type:'heartp',x:px+4,y:fy-12,w:8,h:8});break;
      case 'T':L.ents.push(mk('target',px+2,fy-14,{w:12,h:14,hp:1,noTarget:true,still:true}));L.targets++;break;
      case 'C':L.ents.push({type:'cp',x:px+2,y:fy-16,w:12,h:16,on:false});break;
      case 'G':L.ents.push({type:'goal',x:px,y:fy-24,w:16,h:24});break;
      case 'L':L.ents.push({type:'lotus',x:px+2,y:fy-10,w:12,h:9});break;
      case 'S':L.ents.push({type:'statue',x:px,y:fy-24,w:16,h:24,on:false});break;
      case 'i':L.ents.push({type:'sign',x:px+2,y:fy-12,w:12,h:12,msg:d.signs[si++]||''});break;
      case 'm':case 'M':L.plats.push({x:px,y:fy-6,w:40,h:6,x0:px,y0:fy-6,ax:'x',range:(c==='M'?8:5)*16,t:x*0.7,dx:0,dy:0});break;
      case 'v':L.plats.push({x:px,y:fy-6,w:40,h:6,x0:px,y0:fy-6,ax:'y',range:96,t:0,dx:0,dy:0});break;
    }
  }
  const hp=df.hp;
  L.p={x:L.start.x,y:L.start.y,w:10,h:22,vx:0,vy:0,on:false,co:0,jb:0,face:1,inv:60,cd:0,ch:0,hp,maxhp:hp,anim:0,dead:0,plat:null,lock:false,shootT:0};
  L.cp={x:L.start.x,y:L.start.y};
  for(const k of d.comp){L.ents.push({type:'comp',role:k,x:L.start.x-14,y:L.start.y,w:10,h:22,vx:0,vy:0,face:1,cd:60,on:false,shootT:0});}
  if(L.mode==='parashu'){L.arena={x0:0};startParashu(L);}
  if(L.mode==='horde'){L.arena={x0:0};startHorde(L);}

  if(d.vanvas){toast('ITEM LOST','Yuvraj crown');setTimeout(()=>toast('SITA HAS JOINED','Outfit: valkala bark'),1400);}
  G.L=L;G.paused=false;
  music(L.mode==='parashu'?'boss':'level');

function mk(type,x,y,o){return Object.assign({type,x,y,w:14,h:20,vx:0,vy:0,hp:1,face:-1,t:0,flash:0,enemy:true,on:false,anim:0},o||{});}

function solidAt(L,tx,ty){if(tx<0||tx>=L.w)return true;if(ty<0||ty>=ROWS)return false;const c=L.m[ty][tx];return c==='#'||c==='B';}
function tileAt(L,tx,ty){if(tx<0||tx>=L.w||ty<0||ty>=ROWS)return '.';return L.m[ty][tx];}
function moveX(L,e,dx){e.x+=dx;const t0=Math.floor(e.y/16),t1=Math.floor((e.y+e.h-1)/16);
  if(dx>0){const tx=Math.floor((e.x+e.w-1)/16);for(let ty=t0;ty<=t1;ty++)if(solidAt(L,tx,ty)){e.x=tx*16-e.w;e.vx=0;e.hitWall=1;break;}}
  else if(dx<0){const tx=Math.floor(e.x/16);for(let ty=t0;ty<=t1;ty++)if(solidAt(L,tx,ty)){e.x=(tx+1)*16;e.vx=0;e.hitWall=-1;break;}}}
function moveY(L,e,dy){const ob=e.y+e.h;e.y+=dy;const t0=Math.floor(e.x/16),t1=Math.floor((e.x+e.w-1)/16);
  if(dy>0){const ty=Math.floor((e.y+e.h-1)/16);for(let tx=t0;tx<=t1;tx++){const c=tileAt(L,tx,ty);if(c==='#'||c==='B'||(c==='='&&ob<=ty*16+0.5)){e.y=ty*16-e.h;e.vy=0;e.on=true;break;}}}
  else if(dy<0){const ty=Math.floor(e.y/16);for(let tx=t0;tx<=t1;tx++){const c=tileAt(L,tx,ty);if(c==='#'||c==='B'){e.y=(ty+1)*16;e.vy=0;break;}}}}
function platCollide(L,e){if(e.vy<0)return;for(const q of L.plats){if(e.x+e.w>q.x+1&&e.x<q.x+q.w-1){const b=e.y+e.h;const pb=b-e.vy-q.dy;if(b>=q.y&&pb<=q.y+3){e.y=q.y-e.h;e.vy=0;e.on=true;e.plat=q;}}}}
function physics(L,e,grav){e.vy=Math.min(e.vy+(grav||0.32),6.5);e.hitWall=0;if(e.plat){e.x+=e.plat.dx;e.y+=e.plat.dy;}moveX(L,e,e.vx);e.on=false;e.plat=null;moveY(L,e,e.vy);platCollide(L,e);}

function burst(L,x,y,n,col){for(let i=0;i<n;i++)L.parts.push({x,y,vx:rand(-2,2),vy:rand(-2.6,0.6),l:rand(18,36),c:i%3===0?'#FFF1B0':col,s:i%4===0?2:1,g:0.08});}
function spark(L,x,y,col,n){for(let i=0;i<(n||4);i++)L.parts.push({x,y,vx:rand(-1.4,1.4),vy:rand(-1.4,1.4),l:rand(8,16),c:col||'#FFF1B0',s:1,g:0});}
function puff(L,x,y){for(let i=0;i<8;i++)L.parts.push({x:x+rand(-4,4),y:y+rand(-4,4),vx:rand(-0.6,0.6),vy:rand(-0.8,0),l:rand(14,24),c:'#C9B98A',s:2,g:0});}

function hurt(L,n,force){const p=L.p;if(p.dead||L.done)return;if(p.inv>0&&!force)return;p.hp-=n;L.hits++;p.inv=90;L.shake=8;SFX.hit();p.vy=-3.2;p.vx=-p.face*1.6;if(p.hp<=0){p.hp=0;p.dead=1;p.lock=true;if(!L.failReason)L.failReason='YOUR STRENGTH LEFT YOU.';music(null);SFX.fail();}}
function failLevel(L,reason){if(L.done||L.failing)return;L.failing=true;L.failReason=reason;L.p.dead=Math.max(L.p.dead,1);L.p.lock=true;music(null);SFX.fail();}
function fallOut(L){const p=L.p;if(p.dead||L.done)return;hurt(L,1,true);if(p.hp>0){p.x=L.cp.x;p.y=L.cp.y;p.vx=0;p.vy=0;p.inv=90;for(const e of L.ents)if(e.type==='comp'){e.x=p.x-10;e.y=p.y;e.vy=0;}}}
function complete(L,delay){if(L.done||L.failing)return;L.done=true;L.doneT=delay||70;L.p.inv=9999;L.p.lock=true;music(null);SFX.clear();}

function fireArrow(L,o,divine,friendlyFrom){
  const face=o.face||1;
  if(divine){L.proj.push({kind:'astra',friendly:true,x:face>0?o.x+o.w:o.x-18,y:o.y+8,w:18,h:5,vx:5.6*face,vy:0,dmg:4,pierce:true,life:80});SFX.astra();L.shake=4;}
  else{L.proj.push({kind:'arrow',friendly:true,x:face>0?o.x+o.w:o.x-12,y:o.y+9,w:12,h:3,vx:4.6*face,vy:0,dmg:1,life:70,lak:!!friendlyFrom});friendlyFrom?SFX.lak():SFX.shoot();}
}

function updPlayer(L){
  const p=L.p;
  if(p.dead){p.dead++;if(p.dead>75)goFail(L);return;}
  const lock=p.lock||L.stringing;
  const left=!lock&&keys.left,right=!lock&&keys.right;
  const jP=!lock&&(pressed('jump')||pressed('up')),jH=keys.jump||keys.up;
  const acc=0.34,max=1.65,fr=0.28;
  if(left&&!right){p.vx=Math.max(p.vx-acc,-max);p.face=-1;}else if(right&&!left){p.vx=Math.min(p.vx+acc,max);p.face=1;}else p.vx=Math.abs(p.vx)<fr?0:p.vx-Math.sign(p.vx)*fr;
  if(jP)p.jb=8;else if(p.jb>0)p.jb--;
  if(p.on)p.co=7;else if(p.co>0)p.co--;
  if(p.jb>0&&p.co>0){p.vy=-6;p.jb=0;p.co=0;p.on=false;p.plat=null;SFX.jump();}
  if(!jH&&p.vy<-2.2)p.vy=-2.2;
  physics(L,p);
  if(L.arena){p.x=clamp(p.x,L.arena.x0+2,L.arena.x0+W-p.w-2);}
  if(p.inv>0&&p.inv<9000)p.inv--;
  if(p.cd>0)p.cd--;if(p.shootT>0)p.shootT--;
  if(!lock){
    if(pressed('shoot')&&p.cd<=0){fireArrow(L,p,false);p.cd=14;p.shootT=10;}
    if(keys.shoot&&L.astra){p.ch++;if(p.ch===48)SFX.charge();if(p.ch>15&&G.t%3===0)spark(L,p.x+p.w/2+rand(-8,8),p.y+rand(0,22),p.ch>=48?'#FFF1B0':'#F2C14E',1);}
    if(released('shoot')){if(p.ch>=48&&L.astra){fireArrow(L,p,true);p.shootT=14;p.cd=10;}p.ch=0;}
  } else p.ch=0;
  p.anim+=Math.abs(p.vx)>0.2?1:0;
  // hazards
  const cy=Math.floor((p.y+p.h-2)/16);
  for(let tx=Math.floor((p.x+2)/16);tx<=Math.floor((p.x+p.w-3)/16);tx++){const c=tileAt(L,tx,cy);if(c==='w'){fallOut(L);break;}if(c==='x'){hurt(L,1);}}
  if(p.y>H+16)fallOut(L);
}

function nearest(L,c,range){let best=null,bd=range;for(const e of L.ents){if(!e.enemy||e.dead||e.inert||e.noTarget)continue;const dx=(e.x+e.w/2)-(c.x+c.w/2),dy=(e.y+e.h/2)-(c.y+c.h/2);if(Math.abs(dy)>70)continue;const d2=Math.abs(dx);if(d2<bd){bd=d2;best=e;}}return best;}
function updComp(L,c){
  const p=L.p;
  if(L.mode==='horde'&&c.role==='lak'){c.x=L.hut.x+L.hut.w+2;c.y=GY-22;c.cd--;if(c.shootT>0)c.shootT--;if(c.cd<=0){const t=nearest(L,c,140);if(t){c.face=(t.x>c.x)?1:-1;fireArrow(L,c,false,true);c.cd=48;c.shootT=10;}else c.cd=8;}return;}
  const back=c.role==='lak'?18:32;const tx=p.x-p.face*back;const dx=tx-c.x;
  c.vx=Math.abs(dx)>6?clamp(dx*0.09,-1.9,1.9):0;if(Math.abs(c.vx)>0.2)c.face=c.vx>0?1:-1;else c.face=p.face;
  if(c.on&&(c.hitWall||p.y<c.y-24)&&Math.abs(dx)>10)c.vy=-6;
  physics(L,c);
  if(L.arena)c.x=clamp(c.x,L.arena.x0+2,L.arena.x0+W-c.w-2);
  if(Math.abs(p.x-c.x)>150||Math.abs(p.y-c.y)>120||c.y>H){c.x=p.x-p.face*12;c.y=p.y;c.vy=0;puff(L,c.x+5,c.y+10);}
  c.anim=(c.anim||0)+(Math.abs(c.vx)>0.2?1:0);
  if(c.shootT>0)c.shootT--;
  if(c.role==='lak'&&L.mode!=='parashu'){c.cd--;if(c.cd<=0){const t=nearest(L,c,130);if(t){c.face=(t.x+t.w/2>c.x+c.w/2)?1:-1;fireArrow(L,c,false,true);c.cd=70;c.shootT=10;}else c.cd=10;}}
}

function damage(L,e,n){
  if(e.type==='deer'){deerHit(L,e);return;}
  let m=1;if(e.type==='viradha'&&e.st==='stun')m=2;
  e.hp-=n*m;e.flash=6;
  if(e.boss)SFX.boss();
  spark(L,e.x+e.w/2,e.y+e.h/2,'#FFF1B0',4);
  if(e.hp<=0)killEnt(L,e);else if(!e.boss&&!e.still){e.kb=8;}
}
function killEnt(L,e){

  if(e.type==='target'){L.targets--;if(L.targets===0)toast('TRAINING COMPLETE','All targets down');}
  if(e.counts)L.kills++;

}
function bossDown(L,e){

  L.proj=L.proj.filter(q=>q.friendly);
  if(e.type==='tataka'){L.protect=Math.round(L.yagna.hp);toast('TATAKA DEFEATED','The yagna is safe');L.ents.push({type:'maricha',x:e.x,y:e.y+10,vx:4.4,vy:-2.6,w:14,h:20});setTimeout(()=>toast('MARICHA ESCAPES','Hurled 100 yojanas away'),900);complete(L,190);}
  if(e.type==='viradha'){toast('VIRADHA IS FREED','An old curse lifted');for(let i=0;i<30;i++)L.parts.push({x:e.x+rand(0,e.w),y:e.y+rand(0,e.h),vx:rand(-0.3,0.3),vy:rand(-1.6,-0.4),l:rand(40,80),c:i%2?'#FFF1B0':'#7FD0E0',s:1,g:0});complete(L,170);}
  if(e.type==='khara'){L.protect=Math.round(L.hut.hp);toast('KHARA DEFEATED','14,000 have fallen');complete(L,170);}
}

function throwB(L,b,n){const p=L.p;const bx=b.x+b.w/2,by=b.y+4;for(let i=0;i<n;i++){const tt=n===1?50:40+i*12;const dx=(p.x+5)-bx;L.proj.push({kind:'boulder',x:bx-5,y:by,w:10,h:10,vx:clamp(dx/tt,-3.4,3.4)*(n===1?1:(0.7+i*0.3)),vy:-4,g:0.16,life:240,breakable:true});}}

function updEnt(L,e){
  const df=D();const p=L.p;
  if(e.flash>0)e.flash--;
  switch(e.type){
    case 'walker':case 'wolf':{
      const sp=(e.type==='wolf'?0.8:0.5)*df.spd*(e.spd||1);
      if(e.kb>0){e.kb--;e.vx=0;}
      else if(e.toYagna){const tx=L.yagna.x+L.yagna.w-2;if(e.x>tx)e.vx=-sp;else{e.vx=0;L.yagna.hp-=0.22*df.spd;}}
      else if(e.toHut){if(e.x+e.w<L.hut.x+6)e.vx=sp;else if(e.x>L.hut.x+L.hut.w-6)e.vx=-sp;else{e.vx=0;L.hut.hp-=0.12*df.spd;}}
      else{e.vx=e.face*sp;const ax=e.face>0?e.x+e.w+1:e.x-1;const tx=Math.floor(ax/16),ty=Math.floor((e.y+e.h+2)/16);if(e.on&&!solidAt(L,tx,ty)&&tileAt(L,tx,ty)!=='=')e.face*=-1;}
      physics(L,e);
      if(e.hitWall&&!e.toYagna&&!e.toHut)e.face*=-1;
      if(e.toYagna||e.toHut){if(e.vx)e.face=e.vx<0?-1:1;}
      if(e.y>H+20)e.dead=true;
      e.anim++;if(ov(e,p))hurt(L,1);break;}
    case 'thrower':{e.face=p.x<e.x?-1:1;e.t-=df.fire;const dx=p.x-e.x;if(Math.abs(dx)<170&&Math.abs(p.y-e.y)<90&&e.t<=0){e.t=130;e.pose=16;L.proj.push({kind:'rock',x:e.x+e.w/2,y:e.y+4,w:6,h:6,vx:clamp(dx/55,-2.6,2.6),vy:-3.6,g:0.13,life:200,breakable:true});}if(e.pose>0)e.pose--;physics(L,e);if(ov(e,p))hurt(L,1);break;}
    case 'flyer':{e.t++;if(Math.abs(p.x-e.x0)<140){e.x0+=clamp(p.x-e.x0,-0.35,0.35)*df.spd;e.y0+=clamp(p.y-e.y0,-0.25,0.25)*df.spd;e.y0=Math.max(40,e.y0);}e.x=e.x0+Math.sin(e.t/50)*28;e.y=e.y0+Math.sin(e.t/23)*10;e.face=p.x<e.x?-1:1;if(ov(e,p))hurt(L,1);break;}
    case 'makara':{e.t-=df.fire;if(e.st==='hide'){e.y=e.baseY;e.inert=true;if(e.t<=0){e.st='leap';e.vy=-6.3;e.inert=false;spark(L,e.x+9,e.baseY,'#9AC8F0',6);}}else{e.vy+=0.22;e.y+=e.vy;if(e.y>=e.baseY&&e.vy>0){e.y=e.baseY;e.st='hide';e.t=rand(100,170);spark(L,e.x+9,e.baseY,'#9AC8F0',6);}if(ov(e,p))hurt(L,1);}e.face=e.vy<0?1:-1;break;}
    case 'target':break;
    case 'tataka':updTataka(L,e);break;
    case 'viradha':updViradha(L,e);break;
    case 'khara':updKhara(L,e);break;
    case 'parashu':updParashu(L,e);break;
    case 'deer':updDeer(L,e);break;
    case 'comp':updComp(L,e);break;
    case 'maricha':e.x+=e.vx;e.y+=e.vy;e.vy+=0.02;if(e.x>L.camX+W+40)e.dead=true;break;
    case 'tulsi':if(ov(e,p)){e.dead=true;L.tulsi++;SFX.pick();spark(L,e.x+4,e.y+4,'#7FC98A',6);}break;
    case 'heartp':if(ov(e,p)){e.dead=true;p.hp=Math.min(p.maxhp,p.hp+1);SFX.heart();spark(L,e.x+4,e.y+4,'#E86A9A',6);}break;
    case 'lotus':if(ov(e,p)){e.dead=true;L.lotus++;SFX.heart();toast('LOTUS '+L.lotus+'/3');spark(L,e.x+6,e.y+4,'#FFB0CC',8);}break;
    case 'cp':if(!e.on&&ov(e,p)){if(df.cp){e.on=true;L.cp={x:e.x,y:e.y+16-22};SFX.ok();toast(L.d.cpName||'CHECKPOINT','Progress saved here');}else if(!e.warned){e.warned=true;toast('VALMIKI MODE','No checkpoints');}}break;
    case 'goal':if(ov(e,p)&&!L.done){if(L.d.qte){startQTE(L);}else{if(L.i===0)toast('VISHWAMITRA','Come, Rama.');complete(L,80);}}break;
    case 'statue':if(ov(e,p)&&!e.on){if(L.lotus>=3){e.on=true;burst(L,e.x+8,e.y+10,30,'#FFB0CC');toast('AHALYA RESTORED','Her penance is complete');complete(L,140);}else L.msg='THE STONE WAITS. LOTUSES '+L.lotus+'/3';}break;
    case 'sign':break;
  }
}
function updTataka(L,b){
  const df=D(),x0=L.arena.x0,p=L.p;b.t++;
  const hpf=b.hp/b.max;b.phase=hpf>0.66?1:hpf>0.33?2:3;
  if(b.phase<3){const tx=x0+176+Math.sin(b.t/90)*36;b.x+=clamp(tx-b.x,-0.5,0.5)*df.spd;}
  b.face=p.x<b.x?-1:1;
  b.throwT-=df.fire;if(b.throwT<=0){b.throwT=b.phase===1?120:b.phase===2?96:84;throwB(L,b,b.phase===3?3:1);b.pose=22;}
  if(b.phase>=2){b.stompT-=df.fire;if(b.stompT<=0){b.stompT=220;shock(L,b.x+b.w/2,p.x<b.x?-1:1,2.2*df.spd);L.shake=10;SFX.boom();}}
  if(b.phase===3){b.tpT-=1;if(b.tpT<=0){b.tpT=200;puff(L,b.x+13,b.y+24);b.x=x0+rand(110,210);puff(L,b.x+13,b.y+24);}b.alpha=b.pose>0?1:0.2+0.1*Math.sin(b.t/4);}else b.alpha=1;
  b.spawnT-=df.fire;if(b.spawnT<=0){b.spawnT=[0,260,210,170][b.phase];L.ents.push(mk('walker',x0+236,GY-20,{w:14,h:20,hp:2,toYagna:true,face:-1}));puff(L,x0+243,GY-10);}
  if(b.pose>0)b.pose--;
  if(ov(b,p))hurt(L,1);
  L.meter.val=Math.max(0,L.yagna.hp);
  if(L.yagna.hp<=0)failLevel(L,'THE YAGNA WAS BROKEN.');
}
function updViradha(L,b){
  const df=D(),x0=L.arena.x0,p=L.p;b.t++;
  const ph2=b.hp<b.max/2;
  switch(b.st){
    case 'idle':b.face=p.x<b.x?-1:1;b.stT-=df.fire;if(b.stT<=0){b.st='wind';b.stT=34;}break;
    case 'wind':b.stT--;if(b.stT<=0){b.st='charge';b.vx=b.face*3.1*df.spd;}break;
    case 'charge':b.x+=b.vx;if(b.x<x0+4||b.x+b.w>x0+W-4){b.x=clamp(b.x,x0+4,x0+W-4-b.w);b.st='stun';b.stT=100;L.shake=14;SFX.boom();if(ph2){for(let i=0;i<2;i++)L.proj.push({kind:'rock',x:x0+rand(30,220),y:16,w:6,h:6,vx:0,vy:1,g:0.12,life:200,breakable:true});}}break;
    case 'stun':b.stT--;if(b.stT<=0){if(ph2){b.st='leap';b.vy=-7.4;b.vx=clamp(((p.x)-(b.x+b.w/2))/52,-3,3);}else{b.st='idle';b.stT=60;}}break;
    case 'leap':b.vy+=0.3;b.x+=b.vx;b.y+=b.vy;b.x=clamp(b.x,x0+4,x0+W-4-b.w);if(b.y>=GY-b.h){b.y=GY-b.h;b.vy=0;b.st='idle';b.stT=55;L.shake=12;SFX.boom();shock(L,b.x,-1,2.4*df.spd);shock(L,b.x+b.w,1,2.4*df.spd);}break;
  }
  if(b.st!=='stun'&&ov(b,p))hurt(L,1);
}
function updKhara(L,b){
  const df=D(),p=L.p;b.t++;
  if(b.st==='walk'){b.face=p.x<b.x?-1:1;b.x+=b.face*0.65*df.spd;b.x=clamp(b.x,4,W-4-b.w);b.fireT-=df.fire;if(Math.abs((p.x+5)-(b.x+b.w/2))<34){b.st='wind';b.stT=20;}else if(b.fireT<=0){b.fireT=160;L.proj.push({kind:'fire',x:b.face>0?b.x+b.w:b.x-12,y:p.y+8,w:12,h:4,vx:b.face*2.8,vy:0,life:120,breakable:true});}}
  else if(b.st==='wind'){b.stT--;if(b.stT<=0){b.st='slash';b.stT=12;L.proj.push({kind:'slash',x:b.face>0?b.x+b.w-4:b.x-26,y:b.y+6,w:30,h:30,vx:0,vy:0,life:12,persist:true});SFX.boss();}}
  else if(b.st==='slash'){b.stT--;if(b.stT<=0){b.st='cool';b.stT=50;}}
  else if(b.st==='cool'){b.stT--;if(b.stT<=0)b.st='walk';}
  if(ov(b,p))hurt(L,1);
}
function updParashu(L,b){
  const df=D(),p=L.p;b.t++;if(b.flash>0)b.flash--;b.face=p.x<b.x?-1:1;
  if(b.phase==='fight'){
    b.shockT-=df.fire;if(b.shockT<=0){b.shockT=rand(95,125);shock(L,b.x,-1,2.3*df.spd);b.flash=8;SFX.boom();L.shake=6;}
    b.axeT-=df.fire;if(b.axeT<=0){b.axeT=rand(130,160);const dx=(p.x+5)-(b.x);L.proj.push({kind:'axe',x:b.x,y:b.y+8,w:10,h:10,vx:clamp(dx/55,-3.5,3.5),vy:-4.6,g:0.17,life:200});}
    if(b.t>L.surv*0.45){b.rainT-=df.fire;if(b.rainT<=0){b.rainT=rand(110,150);for(let i=0;i<2;i++)L.proj.push({kind:'warn',x:clamp(p.x+rand(-30,30),8,240),y:GY-4,w:8,h:4,vx:0,vy:0,life:46,safe:true});}}

  }
  else if(b.phase==='offer'){
    const vb=L.ents.find(e=>e.type==='vbow');
    if(vb&&!L.stringing&&ov(vb,p)){L.stringing=true;p.vx=0;L.meter={name:'HOLD BOW TO STRING',val:0,col:'#F2C14E'};}
    if(L.stringing){if(keys.shoot||G.taps.length){L.meter.val+=0.75;if(G.t%6===0)spark(L,p.x+5,p.y+6,'#F2C14E',2);}else L.meter.val=Math.max(0,L.meter.val-0.35);
      if(L.meter.val>=100){vb.dead=true;b.phase='done';toast('PARASHURAMA YIELDS','Vishnu\'s bow is strung');burst(L,p.x+5,p.y+8,30,'#F2C14E');complete(L,150);}}
  }
}
function updDeer(L,e){
  const p=L.p,df=D();e.t++;
  if(L.finale){e.t2=(e.t2||0)+1;return;}
  if(e.st==='wait'){if(e.pt<L.pts.length&&p.x>L.pts[e.pt]*16-210){e.x=L.pts[e.pt]*16;e.y=GY-23;e.st='show';e.t=0;e.alpha=0;spark(L,e.x+12,e.y+10,'#F2C14E',10);e.face=1;}}
  else if(e.st==='show'){e.alpha=Math.min(1,(e.alpha||0)+0.08);e.face=p.x<e.x?1:-1;const last=e.pt>=L.pts.length-1;if(!last&&(e.t>170/df.fire||p.x>e.x+20))e.st='flee';if(last&&e.t%90===0){e.x=L.pts[e.pt]*16+rand(-30,30);spark(L,e.x+12,e.y+10,'#F2C14E',6);}}
  else if(e.st==='flee'){e.x+=3.2;e.alpha-=0.04;e.face=1;if(G.t%3===0)spark(L,e.x+4,e.y+14,'#F2C14E',1);if(e.alpha<=0){e.pt++;e.st='wait';e.x=-200;}}
  e.noTarget=true;e.inert=e.st!=='show';

function deerHit(L,e){if(e.st!=='show')return;e.hp--;e.flash=8;SFX.boss();spark(L,e.x+12,e.y+10,'#FFF1B0',10);
  if(e.hp<=0){L.finale=true;L.p.lock=true;e.st='fallen';burst(L,e.x+12,e.y+10,40,'#F2C14E');SFX.boom();L.flash=14;toast('IT WAS MARICHA','The golden deer was maya');complete(L,190);}
  else if(e.pt<L.pts.length-1)e.st='flee';}

function updHorde(L){

function updProj(L){
  const p=L.p;
  for(const q of L.proj){
    if(q.dead)continue;
    q.x+=q.vx;q.y+=q.vy;if(q.g)q.vy+=q.g;q.life--;
    if(q.life<=0){q.dead=true;if(q.kind==='warn'){L.proj.push({kind:'skyaxe',x:q.x-1,y:-12,w:10,h:12,vx:0,vy:4.2,life:60});}continue;}
    if(q.x<L.camX-40||q.x>L.camX+W+40)q.dead=true;
    if(q.friendly){
      const tx=Math.floor((q.x+q.w/2)/16),ty=Math.floor((q.y+q.h/2)/16);if(q.kind==='arrow'&&solidAt(L,tx,ty)){q.dead=true;spark(L,q.x,q.y,'#C9B98A',3);continue;}
      for(const e of L.ents){if(!e.enemy||e.dead||e.inert)continue;if(q.hit&&q.hit.has(e))continue;if(ov(q,e)){damage(L,e,q.dmg);if(q.pierce){(q.hit||(q.hit=new Set())).add(e);}else{q.dead=true;break;}}}
      if(q.dead)continue;
      for(const h of L.proj){if(h.friendly||h.dead||!h.breakable)continue;if(ov(q,h)){h.dead=true;spark(L,h.x+h.w/2,h.y+h.h/2,'#8A8A98',6);if(!q.pierce){q.dead=true;break;}}}
    } else {
      if(q.kind==='shock'){if(q.x<L.camX-20||q.x>L.camX+W+20)q.dead=true;}
      if((q.kind==='boulder'||q.kind==='rock'||q.kind==='axe')&&q.y+q.h>=GY&&q.vy>0&&solidAt(L,Math.floor((q.x+q.w/2)/16),Math.floor((q.y+q.h)/16))){q.dead=true;spark(L,q.x+q.w/2,q.y+q.h,'#8A8A98',6);continue;}
      if(q.kind==='skyaxe'&&q.y+q.h>=GY){q.dead=true;spark(L,q.x+5,GY,'#D8D8E0',6);continue;}
      if(!q.safe&&ov(q,p)){hurt(L,1);if(!q.persist&&q.kind!=='shock')q.dead=true;}
    }
  }
  L.proj=L.proj.filter(q=>!q.dead);
}

function updLevel(L){
  if(G.paused){pauseMenu(L);return;}
  if(backP()||pressed('start')||G.pz){G.paused=true;G.sel=0;SFX.menu();return;}
  L.time++;
  for(const q of L.plats){const ox=q.x,oy=q.y;q.t+=0.012*D().spd;const k=(1-Math.cos(q.t))/2;if(q.ax==='x')q.x=q.x0+k*q.range;else q.y=q.y0-k*q.range;q.dx=q.x-ox;q.dy=q.y-oy;}
  updPlayer(L);
  if(L.d.arena&&!L.arena&&L.p.x>(L.d.arena.x0+1)*16){L.arena={x0:L.d.arena.x0*16};startBoss(L,L.d.arena.boss);}
  for(const e of L.ents)if(!e.dead)updEnt(L,e);
  if(L.mode==='horde')updHorde(L);
  if(L.mode==='chase'&&L.meter){L.meter.val=Math.max(8,100-clamp(L.p.x/(L.w*16),0,1)*84-Math.min(8,L.time/3600*8));}
  updProj(L);
  L.ents=L.ents.filter(e=>!e.dead);
  for(const q of L.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.l--;}
  L.parts=L.parts.filter(q=>q.l>0);
  // sign messages
  if(!L.msg||L.msg.indexOf('LOTUSES')<0)L.msg=null;
  for(const e of L.ents)if(e.type==='sign'&&Math.abs((e.x+6)-(L.p.x+5))<26&&Math.abs(e.y-L.p.y)<40)L.msg=e.msg;
  if(L.msg&&L.msg.indexOf('LOTUSES')>=0){const st=L.ents.find(e=>e.type==='statue');if(!st||Math.abs(st.x-L.p.x)>40)L.msg=null;}
  // camera
  const target=L.arena?L.arena.x0:clamp(L.p.x+5-128+L.p.face*20,0,L.w*16-W);
  L.camX+=(target-L.camX)*(L.arena?0.15:0.12);L.camX=clamp(L.camX,0,Math.max(0,L.w*16-W));
  if(L.shake>0)L.shake--;if(L.flash>0)L.flash--;
  if(L.failing&&!L.p.dead)L.p.dead=1;
  if(L.done){L.doneT--;if(L.doneT<=0)finishLevel(L);}
}

/* ---------- Pinaka QTE ---------- */
function startQTE(L){G.Q={L,pow:18,t:0,limit:16*60,win:0};G.scene='qte';G.fade=10;music('boss');G.toasts=[];}
function updQTE(){
  const Q=G.Q,L=Q.L,df=D();if(Q.win){Q.win++;L.time++;if(Q.win===2){SFX.boom();}if(Q.win>160){L.done=false;complete(L,1);finishLevel(L);}return;}
  Q.t++;L.time++;
  const taps=(pressed('shoot')?1:0)+(pressed('jump')?1:0)+G.taps.length;
  if(taps){Q.pow+=5.2*taps;SFX.mash();}
  Q.pow-=(0.2+Q.t/Q.limit*0.38)*df.spd;Q.pow=clamp(Q.pow,0,100);
  if(Q.pow>=100){Q.win=1;toast('ACHIEVEMENT','Pinaka broken');}
  if(Q.t>Q.limit){L.failReason='THE BOW DID NOT MOVE.';G.F={reason:L.failReason,i:L.i};G.scene='fail';G.sel=0;music('sad');SFX.fail();}
}

}

/* ---------- loop ---------- */
function step(){
  G.t++;
  for(const t of G.toasts)t.t--;G.toasts=G.toasts.filter(t=>t.t>0);
  if(G.fade>0)G.fade--;
  switch(G.scene){
    case 'title':updTitle();break;case 'diff':updDiff();break;case 'map':updMap();break;case 'story':updStory();break;
    case 'level':updLevel(G.L);break;case 'qte':updQTE();break;case 'choice':updChoice();break;case 'result':updResult();break;
    case 'fail':updFail();break;case 'ending':updEnding();break;
  }
  Object.assign(prev,keys);for(const k in hitK)delete hitK[k];for(const k in relK)delete relK[k];G.taps.length=0;G.pz=false;
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  switch(G.scene){
    case 'title':drawTitle();break;case 'diff':drawDiff();break;case 'map':drawMap();break;case 'story':drawStory();break;
    case 'level':drawLevel(G.L);break;case 'qte':drawQTE();break;case 'choice':drawChoice();break;case 'result':drawResult();break;
    case 'fail':drawFail();break;case 'ending':drawEnding();break;
  }
  if(G.fade>0){ctx.fillStyle='rgba(0,0,0,'+(G.fade/16)+')';ctx.fillRect(0,0,W,H);}
}
let last=0,acc=0;
function loop(ts){if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;let n=0;while(acc>=1000/60&&n<4){step();acc-=1000/60;n++;}if(n===4)acc=0;render();requestAnimationFrame(loop);}
function start(data){
  G.save=(data&&data.save)?Object.assign(defSave(),data.save):loadSave();applySound();
  const go=()=>requestAnimationFrame(loop);
  try{Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'),document.fonts.load('16px "VT323"')]),new Promise(r=>setTimeout(r,1500))]).then(go,go);}catch(e){go();}
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({save:G.save}));}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
